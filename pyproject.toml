[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sekkei"
version = "0.1.0"
description = "Design-first harness for LLM coding agents: a checkable architecture graph, a deterministic linter, self-contained work-package briefs, and drift checks against the code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moe Tabei", email = "tabei@ryun.jp" }]
keywords = ["architecture", "design", "llm", "agents", "spec-driven", "traceability", "linter"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=1.0"]

[project.scripts]
sekkei = "sekkei.cli:main"

[project.urls]
Repository = "https://github.com/yui9696/sekkei"

[tool.setuptools.packages.find]
include = ["sekkei*"]
